<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그룹채팅</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2130;--mute:#7a8093;--line:#e4e7ef;--me:#4f6bff;--other:#eceffa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14161d;--card:#1c1f29;--text:#eceef5;--mute:#8d93a8;--line:#2b2f3d;--me:#5b75ff;--other:#272b3a}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;background:var(--card)}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}
.sub{font-size:12px;color:var(--mute)}
header button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-direction:column;max-width:80%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.other{align-self:flex-start}
.name{font-size:12px;color:var(--mute);margin:0 6px 3px}
.bubble{padding:9px 13px;border-radius:16px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--other)}
.me .bubble{background:var(--me);color:#fff}
.time{font-size:11px;color:var(--mute);margin:3px 6px 0}
.empty{text-align:center;color:var(--mute);font-size:14px;margin:auto}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.bar textarea{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;outline:none;resize:none;max-height:100px}
.bar button{border:0;background:var(--me);color:#fff;border-radius:20px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.bar button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>💬 그룹채팅</h1><div class="sub" id="status">연결 중…</div></div>
    <button id="nickBtn" type="button"></button>
  </header>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="bar">
    <textarea id="msg" rows="1" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button id="send" type="button" disabled>전송</button>
  </div>
</div>
<script>
(function(){
  var list=document.getElementById('list'),msg=document.getElementById('msg'),send=document.getElementById('send'),
      nickBtn=document.getElementById('nickBtn'),statusEl=document.getElementById('status');
  var ws=null,connected=false,online=0,history=[],nick='',myId='';
  try{nick=localStorage.getItem('gc_nick')||'';myId=localStorage.getItem('gc_id')||'';}catch(e){}
  if(!myId){myId='u'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('gc_id',myId);}catch(e){}}

  function setNick(force){
    if(force||!nick){
      var v=prompt('닉네임을 입력하세요',nick||'');
      if(v&&v.trim())nick=v.trim().slice(0,16);
      if(!nick)nick='익명'+Math.floor(Math.random()*900+100);
      try{localStorage.setItem('gc_nick',nick);}catch(e){}
    }
    nickBtn.textContent='✏️ '+nick;
  }
  nickBtn.onclick=function(){setNick(true);};

  function fmt(ts){var d=new Date(ts);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
  function updateStatus(){statusEl.textContent=connected?('접속 중 '+online+'명'):'재연결 중…';}

  function bubble(m){
    var mine=m.uid===myId;
    var row=document.createElement('div');row.className='row '+(mine?'me':'other');
    if(!mine){var n=document.createElement('div');n.className='name';n.textContent=m.name||'익명';row.appendChild(n);}
    var b=document.createElement('div');b.className='bubble';b.textContent=m.text||'';row.appendChild(b);
    var t=document.createElement('div');t.className='time';t.textContent=fmt(m.ts||0);row.appendChild(t);
    return row;
  }
  function renderAll(){
    list.innerHTML='';
    if(!history.length){var e=document.createElement('div');e.className='empty';e.textContent='아직 메시지가 없어요. 첫 메시지를 남겨보세요!';list.appendChild(e);return;}
    history.forEach(function(m){list.appendChild(bubble(m));});
    list.scrollTop=list.scrollHeight;
  }
  function addOne(m){
    history.push(m);
    if(history.length===1){renderAll();return;}
    var atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<80||m.uid===myId;
    list.appendChild(bubble(m));
    if(atBottom)list.scrollTop=list.scrollHeight;
  }

  function connect(){
    var proto=location.protocol==='https:'?'wss://':'ws://';
    ws=new WebSocket(proto+location.host);
    ws.onopen=function(){connected=true;updateStatus();send.disabled=!msg.value.trim();};
    ws.onclose=function(){connected=false;updateStatus();send.disabled=true;setTimeout(connect,2000);};
    ws.onerror=function(){try{ws.close();}catch(e){}};
    ws.onmessage=function(ev){
      var d;try{d=JSON.parse(ev.data);}catch(e){return;}
      if(d.type==='history'){history=d.messages||[];renderAll();}
      else if(d.type==='msg'){addOne(d.message);}
      else if(d.type==='online'){online=d.count;updateStatus();}
    };
  }

  function doSend(){
    var text=msg.value.trim();
    if(!text||!connected)return;
    ws.send(JSON.stringify({type:'msg',uid:myId,name:nick,text:text}));
    msg.value='';msg.style.height='auto';send.disabled=true;
  }
  send.onclick=doSend;
  msg.addEventListener('input',function(){send.disabled=!connected||!msg.value.trim();msg.style.height='auto';msg.style.height=Math.min(msg.scrollHeight,100)+'px';});
  msg.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();doSend();}});

  setNick(false);
  connect();
})();
</script>
</body>
</html>
